<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JerithChain Explorer — Jerith Coin (JER)</title>
<link rel="icon" type="image/png" href="jer-coin-logo.png">
<meta property="og:title" content="JerithChain Explorer">
<meta property="og:description" content="Live Jerith Coin (JER) chain stats: blocks, mining, supply.">
<style>
  :root { --bg:#0b0e14; --card:#121722; --line:#1f2937; --txt:#e5e7eb; --dim:#94a3b8;
          --acc:#f59e0b; --acc2:#38bdf8; --ok:#34d399; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt);
         font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif; min-height:100vh; }
  .wrap { max-width:980px; margin:0 auto; padding:28px 20px 60px; }
  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:22px; }
  .logo { height:52px; width:52px; object-fit:contain; border-radius:10px; flex:none; }
  h1 .logo { height:52px; vertical-align:middle; margin-right:8px; }
  h1 { font-size:26px; letter-spacing:.5px; }
  h1 .ticker { color:var(--acc); }
  .sub { color:var(--dim); font-size:13px; }
  .live { color:var(--ok); font-size:12px; }
  .live::before { content:"●"; margin-right:5px; animation:pulse 2s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card .k { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:1px; }
  .card .v { font-size:21px; font-weight:650; margin-top:3px; font-variant-numeric:tabular-nums; }
  .card .v small { font-size:12px; color:var(--dim); font-weight:400; }
  .search { display:flex; gap:8px; margin-bottom:24px; }
  input { flex:1; background:var(--card); border:1px solid var(--line); color:var(--txt);
          border-radius:10px; padding:11px 14px; font-size:14px; outline:none; }
  input:focus { border-color:var(--acc2); }
  button { background:var(--acc); border:0; color:#111; font-weight:700; border-radius:10px;
           padding:11px 18px; cursor:pointer; font-size:14px; }
  button:hover { filter:brightness(1.08); }
  table { width:100%; border-collapse:collapse; background:var(--card);
          border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:1px;
       color:var(--dim); padding:10px 14px; border-bottom:1px solid var(--line); }
  td { padding:9px 14px; border-bottom:1px solid var(--line); font-size:13.5px;
       font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:0; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; }
  .hash { color:var(--acc2); }
  .muted { color:var(--dim); }
  a { color:var(--acc2); text-decoration:none; }
  a:hover { text-decoration:underline; }
  #detail { margin-top:22px; }
  .hidden { display:none; }
  footer { margin-top:30px; color:var(--dim); font-size:12px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><img class="logo" src="jer-coin-logo.png" alt="Jerith Coin logo">Jerith<span class="ticker">Coin</span> Explorer</h1>
    <span class="sub">JerithChain · PoW · Ed25519</span>
    <span class="live" id="live">live</span>
    <span class="sub" id="src-note">connecting…</span>
  </header>

  <div class="grid" id="stats">
    <div class="card"><div class="k">Height</div><div class="v" id="s-height">—</div></div>
    <div class="card"><div class="k">Circulating</div><div class="v" id="s-circ">—</div><div class="k" id="s-pct"></div></div>
    <div class="card"><div class="k">Block reward</div><div class="v" id="s-reward">—</div></div>
    <div class="card"><div class="k">Difficulty</div><div class="v" id="s-diff">—</div><div class="k" id="s-target"></div></div>
    <div class="card"><div class="k">Addresses</div><div class="v" id="s-addr">—</div></div>
    <div class="card"><div class="k">Mines ok / fail</div><div class="v" id="s-mines">—</div></div>
  </div>

  <div class="search">
    <input id="q" placeholder="Search block height, tx id, or JER address…" spellcheck="false">
    <button onclick="doSearch()">Search</button>
  </div>

  <h2 style="font-size:15px;margin:6px 0 10px;color:var(--dim)">Latest blocks</h2>
  <table id="blocks">
    <thead><tr><th>Height</th><th>Hash</th><th>Txs</th><th>Reward</th><th>Age</th></tr></thead>
    <tbody></tbody>
  </table>

  <div id="detail" class="hidden"></div>

  <footer>JerithChain · every balance is an on-chain signed transaction · data refreshed every 15s</footer>
</div>

<script>
// Data sources, in order:
//   1. A live explorer API — ONLY when this page is actually being served by
//      the explorer itself (same-origin port 8303, or an explicit
//      window.JERITH_API override). We never probe localhost/127.0.0.1 from a
//      public page: a visitor's browser must not be asked to reach into
//      someone's (or their own) local node.
//   2. The network snapshot: ./snapshot.json next to this page (refreshed
//      every 5 minutes by the node's snapshot publisher), falling back to the
//      GitHub Pages copy if the local one is missing.
const LIVE_API = window.JERITH_API ||
  (location.protocol.startsWith("http") && location.port === "8303" ? location.origin : null);
const SNAP_URLS = window.JERITH_SNAPSHOT
  ? [window.JERITH_SNAPSHOT]
  : ["./snapshot.json",
     "https://paradoxfuzzle.github.io/jerithchain/snapshot.json"];
const uj = (n) => (n/1e6).toLocaleString(undefined,{maximumFractionDigits:2});
const age = (ts) => { const s = Math.max(0, Math.floor(Date.now()/1000 - ts));
  if (s < 60) return s + "s"; if (s < 3600) return Math.floor(s/60) + "m";
  if (s < 86400) return Math.floor(s/3600) + "h"; return Math.floor(s/86400) + "d"; };
const short = (h) => h ? h.slice(0,10) + "…" + h.slice(-6) : "—";

function snapResolve(S, path) {
  if (path.startsWith("/api/status")) return S.status;
  if (path.startsWith("/api/blocks")) {
    const u = new URLSearchParams((path.split("?")[1] || ""));
    const lim = Math.max(1, Math.min(parseInt(u.get("limit") || "20", 10), S.blocks.length));
    const off = parseInt(u.get("offset") || "0", 10);
    return { blocks: S.blocks.slice(off, off + lim) };
  }
  let m = path.match(/^\/api\/block\/(\d+)$/);
  if (m) { const b = S.blocks.find(b => b.height === +m[1]); if (!b) throw new Error(404); return b; }
  m = path.match(/^\/api\/tx\/([0-9a-f]{8,64})$/);
  if (m) { for (const b of S.blocks) for (const tx of (b.transactions || []))
      if (tx.txid === m[1]) return tx; throw new Error(404); }
  m = path.match(/^\/api\/address\/(.+)$/);
  if (m) { const rec = (S.addresses || {})[m[1]]; if (!rec) throw new Error(404);
    return Object.assign({ address: m[1] }, rec); }
  throw new Error("bad path");
}
let SNAP = null;
let snapPromise = null;
function markSource(txt) {
  const el = document.getElementById("src-note");
  if (el) el.textContent = txt;
}
async function loadSnapshot() {
  if (SNAP) return SNAP;
  if (!snapPromise) {
    snapPromise = (async () => {
      let lastErr = null;
      for (const url of SNAP_URLS) {
        try {
          const r = await fetch(url, { cache: "no-store" });
          if (!r.ok) throw new Error("HTTP " + r.status);
          SNAP = await r.json();
          markSource(url.includes("github.io") ? "network snapshot (github.pages)" : "network snapshot (this site)");
          return SNAP;
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error("no snapshot source reachable");
    })();
  }
  return snapPromise;
}
async function j(path) {
  if (LIVE_API) {
    try { const r = await fetch(LIVE_API + path); if (r.ok) { markSource("live node api"); return await r.json(); } } catch (e) {}
  }
  return snapResolve(await loadSnapshot(), path);
}

async function refresh() {
  try {
    const s = await j("/api/status");
    document.getElementById("s-height").textContent = s.height.toLocaleString();
    document.getElementById("s-circ").innerHTML = uj(s.circulating_uj) + " <small>JER</small>";
    document.getElementById("s-pct").textContent = (100*s.circulating_uj/s.max_supply_uj).toFixed(2) + "% of 1B max";
    document.getElementById("s-reward").innerHTML = uj(s.block_reward_uj) + " <small>JER</small>";
    document.getElementById("s-diff").textContent = s.difficulty_bits + " bits";
    document.getElementById("s-target").textContent = "~" + s.target_block_seconds + "s blocks";
    document.getElementById("s-addr").textContent = s.addresses.toLocaleString();
    document.getElementById("s-mines").textContent = s.mines_ok + " / " + s.mines_fail;
    const b = await j("/api/blocks?limit=15");
    const tb = document.querySelector("#blocks tbody");
    tb.innerHTML = "";
    for (const blk of b.blocks) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td><a href="#" onclick="show('block',${blk.height});return false">${blk.height}</a></td>
        <td class="mono hash" title="${blk.hash}">${short(blk.hash)}</td>
        <td>${blk.txs ?? (blk.transactions ? blk.transactions.length : 0)}</td><td>${uj(blk.reward_uj)} JER</td><td class="muted">${age(blk.timestamp)} ago</td>`;
      tb.appendChild(tr);
    }
    document.getElementById("live").style.opacity = 1;
  } catch (e) {
    document.getElementById("live").style.opacity = .3;
  }
}

async function show(kind, id) {
  const d = document.getElementById("detail");
  try {
    if (kind === "block") {
      const b = await j("/api/block/" + id);
      d.classList.remove("hidden");
      d.innerHTML = `<div class="card"><div class="k">Block ${b.height}</div>
        <div class="mono" style="margin:6px 0">hash <span class="hash">${b.hash}</span></div>
        <div class="mono muted">prev ${short(b.prev_hash)} · nonce ${b.nonce} · diff ${b.difficulty} bits · ${age(b.timestamp)} ago</div>
        <table style="margin-top:10px"><thead><tr><th>Tx</th><th>Kind</th><th>From</th><th>To</th><th>Amount</th></tr></thead><tbody>` +
        b.transactions.map(t => `<tr><td class="mono hash" title="${t.txid}">${short(t.txid)}</td>
          <td>${t.kind}</td><td class="mono" title="${t.sender}">${t.sender==="JER00000000000000000000000000000000"?"⛏ coinbase":short(t.sender)}</td>
          <td class="mono" title="${t.recipient}">${short(t.recipient)}</td><td>${uj(t.amount_uj)} JER</td></tr>`).join("") +
        `</tbody></table></div>`;
    } else if (kind === "tx") {
      const t = await j("/api/tx/" + id);
      d.classList.remove("hidden");
      d.innerHTML = `<div class="card"><div class="k">Transaction</div>
        <div class="mono" style="margin:6px 0"><span class="hash">${t.txid}</span></div>
        <div class="mono muted">block ${t.height} · ${t.kind} · fee ${uj(t.fee_uj)} JER</div>
        <div style="margin-top:8px">${t.memo ? "memo: " + t.memo : ""}</div></div>`;
    } else {
      const a = await j("/api/address/" + id);
      d.classList.remove("hidden");
      d.innerHTML = `<div class="card"><div class="k">Address</div>
        <div class="mono hash" style="margin:6px 0">${a.address}</div>
        <div class="v">${uj(a.balance_uj)} <small>JER</small></div>
        <table style="margin-top:10px"><thead><tr><th>Block</th><th>Kind</th><th>Amount</th><th>Memo</th></tr></thead><tbody>` +
        a.transactions.map(t => `<tr><td><a href="#" onclick="show('block',${t.height});return false">${t.height}</a></td>
          <td>${t.kind}</td><td>${uj(t.amount_uj)} JER</td><td class="muted">${t.memo||""}</td></tr>`).join("") +
        `</tbody></table></div>`;
    }
    d.scrollIntoView({behavior:"smooth", block:"nearest"});
  } catch (e) {
    d.classList.remove("hidden");
    d.innerHTML = `<div class="card"><div class="k">Not found</div><div class="muted">No ${kind} matching that query on JerithChain.</div></div>`;
  }
}

function doSearch() {
  const v = document.getElementById("q").value.trim();
  if (!v) return;
  if (/^JER[0-9A-F]{32}$/.test(v)) show("address", v);
  else if (/^\d+$/.test(v) && v.length < 12) show("block", parseInt(v,10));
  else if (/^[0-9a-f]{64}$/.test(v)) show("tx", v);
  else show("address", v);
}
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

refresh(); setInterval(refresh, 15000);
</script>
</body>
</html>
